<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Keys | Checkout Fictício</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="header">
  <div class="container header-container">
    <div class="logo">
      <h1>Cube <span>Keys</span></h1>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
      <a href="como-fiz.html">Como Fiz</a>
    </nav>
  </div>
</header>

  <main class="container page-content">
    <h2 class="page-title">Finalizar Compra</h2>

    <div class="checkout-container">
      <form id="checkout-page-form" class="checkout-form-card">
        <h3>Dados do Comprador</h3>
        
        <div class="form-group">
          <label for="name">Nome Completo</label>
          <input type="text" id="name" required placeholder="Digite seu nome">
        </div>

        <div class="form-group">
          <label for="email">E-mail para Envio das Chaves</label>
          <input type="email" id="email" required placeholder="seu@email.com">
        </div>

        <div class="form-group">
          <label for="payment">Forma de Pagamento Simulado</label>
          <select id="payment" required>
            <option value="pix">PIX (Aprovação Instantânea)</option>
            <option value="cartao">Cartão de Crédito</option>
          </select>
        </div>

        <div class="checkout-summary-box">
          <h4>Itens Selecionados:</h4>
          <div id="checkout-items-preview">
            <!-- Resumo dos itens via JS -->
          </div>
          <div class="summary-row total-highlight">
            <span>Total a Pagar:</span>
            <span id="checkout-total">R$ 0,00</span>
          </div>
        </div>

        <button type="submit" class="btn-primary block">Finalizar Compra e Gerar Chaves</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Cube Keys — Projeto para o Bootcamp AI/R</p>
    </div>
  </footer>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
