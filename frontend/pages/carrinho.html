<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cube Keys | Seu Carrinho</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

  <header class="header">
  <div class="container header-container">
    <div class="logo">
      <h1>Cube <span>Keys</span></h1>
    </div>
    <nav>
      <a href="../index.html">Home</a>
      <a href="como-fiz.html">Como Fiz</a>
    </nav>
  </div>
</header>

  <main class="container page-content">
    <h2 class="page-title">Seu Carrinho de Compras</h2>

    <div class="cart-container">
      <div id="cart-items" class="cart-items-list">
        <!-- Lista de itens do carrinho via JS -->
      </div>

      <div class="cart-summary-card">
        <h3>Resumo do Pedido</h3>
        <div class="summary-row">
          <span>Total:</span>
          <span id="cart-total" class="summary-price">R$ 0,00</span>
        </div>
        <a href="checkout.html" id="btn-go-checkout" class="btn-primary block">Finalizar Compra</a>
        <a href="../index.html" class="btn-secondary block">Continuar Comprando</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Cube Keys — Projeto para o Bootcamp AI/R</p>
    </div>
  </footer>

  <script src="../assets/js/app.js"></script>
</body>
</html>
